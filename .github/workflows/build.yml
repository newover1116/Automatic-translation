name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "ScreenTranslator-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-${{ github.run_number }}
          path: ScreenTranslator-${{ github.run_number }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 화면 번역기 빌드 ${{ github.run_number }}
          body: 아래 Assets에서 ScreenTranslator-${{ github.run_number }}.apk 를 눌러 받은 뒤 설치하세요.
          files: ScreenTranslator-${{ github.run_number }}.apk
          make_latest: true
