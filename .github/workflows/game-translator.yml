name: Build Game Translator

on:
  push:
    branches: [ game-translator ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Download Korean font
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o app/src/main/assets/NanumGothic-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Regular.ttf \
            || { rm -f app/src/main/assets/NanumGothic-Regular.ttf; echo "::warning::Korean font download failed"; }

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        run: |
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan game-translator-ci-log
          git rm -rfq --cached .
          tail -n 300 /tmp/build.log > build-failure.log
          git add build-failure.log
          git commit -m "Build log for run ${{ github.run_number }}"
          git push -f origin game-translator-ci-log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "GameTranslator-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-${{ github.run_number }}
          path: GameTranslator-${{ github.run_number }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: game-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: 게임 번역기 빌드 ${{ github.run_number }}
          body: 아래 Assets에서 GameTranslator-${{ github.run_number }}.apk 를 눌러 받은 뒤 설치하세요.
          files: GameTranslator-${{ github.run_number }}.apk
          make_latest: false
